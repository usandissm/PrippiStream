<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Hero responsive test</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail">
      <nav class="rail-nav">
        <button class="active"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v9.7H15v-7H9v7H3z"/></svg><em>Home</em></button>
      </nav>
    </aside>
    <main class="main">
      <header class="header">
        <h1>Home</h1>
        <img class="header-logo" src="../assets/prippistream_logo_banner.png" alt="PrippiStream">
        <div class="connection ok"><span></span> Catalogo pronto</div>
      </header>
      <div id="content" class="content">
        <div class="home-layout">
          <section class="hero">
            <div class="hero-art" style="background-image:linear-gradient(120deg,#243d58,#9a633f 66%,#d1a16e)"></div>
            <div class="hero-copy">
              <span class="eyebrow">In evidenza</span>
              <h2>Anche gli angeli mangiano fagioli</h2>
              <p>Nella New York degli anni '30 due scapestrati senza lavoro si arruolano nella malavita del racket, ma buoni di indole si schierano presto dalla parte giusta.</p>
              <button class="hero-action" data-focusable>Scopri</button>
            </div>
          </section>
          <div class="home-scroll">
            <section class="row"><div class="row-header"><h2>Continua a guardare</h2><span class="row-count">3</span></div></section>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
