<div id="shell" class="app-shell">
    <aside class="rail" aria-label="Navigazione principale">
      <nav id="navigation" class="rail-nav">
        <button data-nav="home" data-focusable data-zone="nav" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-7H9v7H3.5a.5.5 0 0 1-.5-.5z"/></svg><em>Home</em>
        </button>
        <button data-nav="search" data-focusable data-zone="nav" aria-label="Cerca">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><em>Cerca</em>
        </button>
        <button data-nav="browse" data-focusable data-zone="nav" aria-label="Sfoglia">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><em>Sfoglia</em>
        </button>
        <button data-nav="live" data-focusable data-zone="nav" aria-label="Live">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m9 3 3 3 3-3"/><circle cx="17" cy="12.5" r="1.5"/></svg><em>Live</em>
        </button>
        <button data-nav="downloads" data-focusable data-zone="nav" aria-label="Download">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></svg><em>Download</em>
        </button>
      </nav>
      <button class="rail-settings" data-nav="settings" data-focusable data-zone="nav" aria-label="Impostazioni">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg><em>Impostazioni</em>
      </button>
    </aside>

    <main class="main">
      <header class="header">
        <h1 id="page-title">Home</h1>
        <img class="header-logo" src="assets/prippistream_logo_banner.png" alt="PrippiStream">
        <div id="connection" class="connection"><span></span> Collegamento...</div>
      </header>
      <div id="content" class="content" aria-live="polite"></div>
    </main>
  </div>

  <section id="detail" class="overlay hidden" aria-label="Dettaglio contenuto"></section>

  <section id="player" class="player hidden" aria-label="Player" tabindex="-1">
    <video id="html-player" playsinline></video>
    <object id="avplay" type="application/avplayer"></object>
    <div id="player-ui" class="player-ui">
      <div class="player-shade"></div>
      <div class="player-top">
        <button id="player-exit" class="player-exit player-icon-button" data-focusable data-zone="player-top" aria-label="Esci dal player">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M29 10 15 24l14 14M16 24h24"/></svg>
        </button>
        <div class="player-heading">
          <h2 id="player-title"></h2>
          <p id="player-subtitle"></p>
        </div>
        <div id="player-status" class="player-status" aria-live="polite"></div>
      </div>

      <div class="player-center" aria-label="Controlli di riproduzione">
        <button id="player-rewind" class="player-seek-button" data-focusable data-zone="player-center" aria-label="Indietro di 10 secondi">
          <span class="seek-arrow" aria-hidden="true">↶</span><strong>10</strong>
        </button>
        <button id="player-toggle" class="player-toggle" data-focusable data-zone="player-center" aria-label="Pausa">
          <svg class="icon-pause" viewBox="0 0 48 48" aria-hidden="true"><path d="M14 9h7v30h-7zM27 9h7v30h-7z"/></svg>
          <svg class="icon-play" viewBox="0 0 48 48" aria-hidden="true"><path d="m16 9 25 15-25 15z"/></svg>
        </button>
        <button id="player-forward" class="player-seek-button" data-focusable data-zone="player-center" aria-label="Avanti di 10 secondi">
          <span class="seek-arrow" aria-hidden="true">↷</span><strong>10</strong>
        </button>
      </div>

      <div class="player-bottom">
        <div id="player-timeline-wrap" class="timeline-wrap">
          <span id="player-current">0:00</span>
          <button id="player-scrubber" class="timeline" data-focusable data-zone="player-timeline" role="slider" aria-label="Posizione video" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="player-progress"></span><i id="player-thumb"></i>
          </button>
          <span id="player-duration">0:00</span>
        </div>
        <div id="player-live-info" class="player-live-info" aria-live="polite">
          <span class="live-dot"></span>
          <div><strong>IN DIRETTA</strong><small id="player-live-program"></small></div>
          <span class="player-zap-hint">CH + / CH − cambia canale</span>
        </div>
        <div id="player-actions" class="player-actions" aria-label="Azioni player">
          <button id="player-episodes" class="hidden" data-focusable data-zone="player-actions">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 15h34v25H7zM12 8h24v7M17 3h14v5"/></svg><span>Episodi</span>
          </button>
          <button id="player-tracks" class="hidden" data-focusable data-zone="player-actions">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 12h38v25H5zM11 20h10M11 27h16M31 20h6M31 27h6"/></svg><span>Audio e sottotitoli</span>
          </button>
          <button id="player-next" class="hidden" data-focusable data-zone="player-actions">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="m9 9 24 15L9 39zM37 9v30"/></svg><span>Episodio successivo</span>
          </button>
        </div>
      </div>
    </div>
    <div id="up-next" class="up-next hidden">
      <span>PROSSIMA PUNTATA</span>
      <h3 id="up-next-title"></h3>
      <p id="up-next-timer">Parte automaticamente tra 1:00</p>
      <div class="up-next-bar"><i id="up-next-progress"></i></div>
      <div class="up-next-actions">
        <button id="up-next-play" data-focusable data-zone="upnext">Guarda subito</button>
        <button id="up-next-cancel" data-focusable data-zone="upnext">Annulla</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status"></div>
