name: Verify Kodi Release

# The tested runtime is packaged locally. Verify the committed ZIP; Pages
# publishes docs/ without a second build/version bump or a write-back race.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'addon.xml'
      - 'changelog.txt'
      - 'platformcode/**'
      - 'core/**'
      - 'channels/**'
      - 'resources/**'
      - 'specials/**'
      - 'docs/addons.xml*'
      - 'docs/plugin.video.prippistream/**'
      - 'docs/plugin.video.prippistream.zip'
      - 'tools/verify_kodi_release.py'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify update feed, ZIP, runtime and approved popup notes
        run: python tools/verify_kodi_release.py
